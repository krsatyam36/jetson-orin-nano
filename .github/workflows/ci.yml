name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: sudo apt-get update -y && sudo apt-get install -y espeak alsa-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pre-commit flake8 black mypy

      - name: Lint with flake8
        run: flake8 . --max-line-length=120 --ignore=E203,W503 --exclude=.git,__pycache__,tests

      - name: Check formatting with black
        run: black --check --diff .

      - name: Run tests
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing

      - name: Run pre-commit hooks
        run: pre-commit run --all-files || true
